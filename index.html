<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🎮 Choisis ton jeu</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🎮</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Mono:wght@300;400;500&family=Black+Ops+One&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#0a0d12;
  color:#f0ead8;
  font-family:'DM Mono',monospace;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
  overflow-x:hidden;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 55% 45% at 25% 40%, rgba(201,168,76,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 55% 45% at 75% 60%, rgba(255,59,59,0.05) 0%, transparent 70%);
  pointer-events:none;
  z-index:0;
}

.wrap{position:relative;z-index:1;width:100%;max-width:760px;text-align:center}

.eyebrow{font-size:0.6rem;letter-spacing:0.5em;text-transform:uppercase;color:rgba(240,234,216,0.4);margin-bottom:14px}
h1{
  font-family:'Cormorant Garamond',serif;
  font-weight:300;
  font-size:clamp(2.2rem,6vw,3.6rem);
  letter-spacing:0.04em;
  line-height:1;
  margin-bottom:6px;
}
h1 em{font-style:italic;color:#c9a84c}
.sub{font-size:0.68rem;letter-spacing:0.18em;text-transform:uppercase;color:rgba(240,234,216,0.35);margin-bottom:44px}

.games{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}

.game-card{
  flex:1;
  min-width:250px;
  max-width:340px;
  text-decoration:none;
  color:inherit;
  border-radius:16px;
  padding:38px 28px 32px;
  position:relative;
  overflow:hidden;
  transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
}
.game-card:hover{transform:translateY(-6px) scale(1.02)}
.game-card:active{transform:translateY(-2px) scale(1.0)}

/* ── PALMIER ── */
.card-palmier{
  background:linear-gradient(165deg,#10151e 0%,#141c28 100%);
  border:1px solid #2a3548;
  box-shadow:0 16px 50px rgba(0,0,0,0.55);
}
.card-palmier:hover{
  border-color:rgba(201,168,76,0.5);
  box-shadow:0 24px 70px rgba(0,0,0,0.65),0 0 0 1px rgba(201,168,76,0.2),0 0 40px rgba(201,168,76,0.08);
}
.card-palmier .game-icon{font-size:3.4rem;line-height:1}
.card-palmier .game-name{
  font-family:'Cormorant Garamond',serif;
  font-weight:300;
  font-size:2rem;
  letter-spacing:0.08em;
  color:#f0ead8;
}
.card-palmier .game-name em{font-style:italic;color:#c9a84c}
.card-palmier .game-desc{font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;color:rgba(240,234,216,0.4);line-height:1.8}
.card-palmier .game-cta{
  margin-top:14px;
  font-size:0.6rem;
  letter-spacing:0.3em;
  text-transform:uppercase;
  color:#c9a84c;
  border:1px solid rgba(201,168,76,0.35);
  padding:9px 22px;
  border-radius:4px;
  transition:all 0.2s;
}
.card-palmier:hover .game-cta{background:rgba(201,168,76,0.12);border-color:#c9a84c}
.card-palmier .suits{
  position:absolute;
  top:12px;right:16px;
  font-size:0.75rem;
  letter-spacing:0.3em;
  color:rgba(201,168,76,0.25);
}

/* ── SNIPER ── */
.card-sniper{
  background:linear-gradient(165deg,#0f0f16 0%,#12121a 100%);
  border:1px solid #1e1e2e;
  box-shadow:0 16px 50px rgba(0,0,0,0.55);
  font-family:'Rajdhani',sans-serif;
}
.card-sniper:hover{
  border-color:rgba(255,59,59,0.5);
  box-shadow:0 24px 70px rgba(0,0,0,0.65),0 0 0 1px rgba(255,59,59,0.2),0 0 40px rgba(255,59,59,0.08);
}
.card-sniper .game-icon{font-size:3.4rem;line-height:1}
.card-sniper .game-name{
  font-family:'Black Ops One',cursive;
  font-size:1.7rem;
  letter-spacing:0.12em;
  color:#eeeef5;
  text-transform:uppercase;
}
.card-sniper .game-name span{color:#ff3b3b}
.card-sniper .game-desc{font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;color:rgba(238,238,245,0.4);line-height:1.8;font-weight:600}
.card-sniper .game-cta{
  margin-top:14px;
  font-size:0.65rem;
  letter-spacing:0.3em;
  text-transform:uppercase;
  color:#ff3b3b;
  border:1px solid rgba(255,59,59,0.35);
  padding:9px 22px;
  border-radius:4px;
  font-weight:700;
  transition:all 0.2s;
}
.card-sniper:hover .game-cta{background:rgba(255,59,59,0.12);border-color:#ff3b3b}
.card-sniper .crosshair{
  position:absolute;
  top:12px;right:16px;
  font-size:0.9rem;
  color:rgba(255,59,59,0.3);
}

.footer{margin-top:48px;font-size:0.55rem;letter-spacing:0.25em;text-transform:uppercase;color:rgba(240,234,216,0.2)}

@media(max-width:600px){
  .games{flex-direction:column;align-items:center}
  .game-card{width:100%;max-width:340px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Soirée</div>
  <h1>Choisis ton <em>jeu</em></h1>
  <div class="sub">Deux jeux &middot; une seule règle : s'amuser</div>

  <div class="games">
    <a class="game-card card-palmier" href="palmier.html">
      <div class="suits">♠ ♥ ♦ ♣</div>
      <div class="game-icon">🌴</div>
      <div class="game-name">Le <em>Palmier</em></div>
      <div class="game-desc">52 cartes &middot; 52 règles<br>Jeu à boire</div>
      <div class="game-cta">Jouer</div>
    </a>

    <a class="game-card card-sniper" href="sniper.html">
      <div class="crosshair">⌖</div>
      <div class="game-icon">🎯</div>
      <div class="game-name">Sni<span>per</span></div>
      <div class="game-desc">Vise &middot; Tire &middot; Gagne<br>Duel entre joueurs</div>
      <div class="game-cta">Jouer</div>
    </a>
  </div>

  <div class="footer">MH475</div>
</div>
</body>
</html>
